<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siege Breaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&amp;family=Chakra+Petch:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Design plan: the battlefield is the bright thing; everything around it is the lid of an
   olive ammo crate with stencilled yellow paint. One theme on purpose (a game world, not a document). */
:root{
  --crate:#2b3421;        /* painted crate: page background */
  --panel:#38442b;        /* raised panels, buttons */
  --panel-hi:#4a5936;     /* hover / selected fill */
  --edge:#1a2013;         /* seams and borders */
  --khaki:#e7dfbd;        /* main text */
  --khaki-dim:#a8a481;    /* secondary text */
  --stencil:#f3c22b;      /* stencil yellow: selection, money, primary action */
  --signal:#ea5338;       /* danger, enemy */
  --ok:#86c44f;           /* healthy */
  --font-display:"Black Ops One","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --font-body:"Chakra Petch","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--crate);overflow-x:hidden}
body{margin:0;background:var(--crate);color:var(--khaki);font-family:var(--font-body);font-size:15px;line-height:1.35;
  display:flex;justify-content:center;overflow-x:hidden;-webkit-text-size-adjust:100%;
  padding:calc(env(safe-area-inset-top,0px) + 8px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 8px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--stencil);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.stencil{font-family:var(--font-display);font-weight:400;letter-spacing:.02em}

#app{width:100%;max-width:1800px;display:grid;gap:8px;align-content:start;align-self:flex-start;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"hud hud hud" "stage stage stage" "retreat bar advance" "info info info"}
#hud{grid-area:hud} #stage{grid-area:stage} #bar{grid-area:bar} #info{grid-area:info}
#btnRetreat{grid-area:retreat} #btnAdvance{grid-area:advance}
#hud,#bar,#info,.cmd{margin-inline:16px}
#btnRetreat{margin-right:0} #btnAdvance{margin-left:0} #bar{margin-inline:0}

/* ---- top strip ---- */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tag.level{order:1}.tag.launches{order:2}.hud-gap{order:3;flex:1}.tag.coins{order:4}.tag.base{order:5}.tag.bank{order:6}.hud-btns{order:7}
.hud-break{display:none}
.tag{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;background:var(--panel);border:1px solid var(--edge);border-radius:3px;white-space:nowrap}
.tag .lbl{color:var(--khaki-dim);font-size:13px}
.tag.level{background:none;border-color:transparent;padding-left:0}
.tag.level .stencil{font-size:21px;color:var(--stencil);line-height:1}
.tag.level .of{color:var(--khaki-dim);font-size:13px}
.tag.coins .num,.tag.bank .num{color:var(--stencil)}
.tag svg{width:15px;height:15px;flex:none;fill:var(--khaki-dim)}
.meter{width:110px;height:10px;background:#1c2414;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.meter span{display:block;height:100%;width:100%;background:var(--ok);transition:width .15s linear,background-color .3s}
.tag.base.hit{border-color:var(--signal);background:#5a2c22}
.tag.launches.empty{border-color:var(--signal)}.tag.launches.empty .num{color:var(--signal)}
.tag.bump .num{animation:bump .28s ease-out}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.hud-btns{display:flex;gap:6px}
.icon-btn{width:36px;height:34px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:0}
.icon-btn svg{width:17px;height:17px;fill:var(--khaki)}
.icon-btn:hover{background:var(--panel-hi)}
.icon-btn[aria-pressed="true"]{background:var(--stencil);border-color:var(--stencil)}
.icon-btn[aria-pressed="true"] svg{fill:#1c2110}

/* ---- battlefield ---- */
#stage{position:relative;display:grid;place-items:center;min-width:0}
#field{position:relative;line-height:0;border:2px solid var(--edge);border-radius:4px;overflow:hidden;background:#7ec0ee}
canvas#c{display:block;touch-action:none;width:100%;height:auto;cursor:crosshair}
#banner{position:absolute;left:0;right:0;top:16%;text-align:center;pointer-events:none;line-height:1.1;opacity:0}
#banner .big{display:block;font-family:var(--font-display);font-size:clamp(26px,6.2vw,58px);color:#fff;-webkit-text-stroke:1px rgba(20,26,14,.55);text-shadow:0 3px 0 rgba(20,26,14,.55)}
#banner .sub{display:inline-block;margin-top:6px;padding:3px 12px;font-size:clamp(12px,2.2vw,17px);font-weight:600;color:#1c2110;background:var(--stencil);border-radius:2px;line-height:1.3}
#banner.show{animation:banner 2.6s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translateY(-10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#hint{position:absolute;left:50%;bottom:1.2%;transform:translateX(-50%);width:max-content;max-width:96%;padding:3px 12px;border-radius:3px;background:rgba(26,32,19,.9);color:var(--khaki);
  font-size:clamp(12px,1.7vw,15px);font-weight:500;line-height:1.3;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#hint.show{opacity:1}
#hint.warn{background:rgba(120,34,20,.92);color:#fff}

/* ---- troop bar ---- */
#bar{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;min-width:0}
.troop{position:relative;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto;justify-items:center;align-items:center;text-align:center;width:48px;
  padding:3px 2px 2px;background:var(--panel);border:1px solid var(--edge);border-bottom-width:3px;border-radius:3px}
.troop canvas{width:30px;height:30px}
.troop .nm{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}   /* name is in the line below the bar */
.troop .cost{font-size:11.5px;line-height:1.1;color:var(--stencil);font-variant-numeric:tabular-nums}
.troop .cost.free{color:var(--khaki-dim)}
.troop .key{position:absolute;top:1px;right:3px;font-size:9px;color:var(--khaki-dim);opacity:.8}
.troop:hover{background:var(--panel-hi)}
.troop.on{background:var(--panel-hi);border-color:var(--stencil);box-shadow:inset 0 0 0 1px var(--stencil)}
.troop.poor canvas,.troop.poor .nm{opacity:.45}
.troop.poor .cost{color:var(--signal)}
.troop.sep{margin-left:8px}
@media (hover:none){.troop .key{display:none}}

/* ---- Advance / Retreat ---- */
.cmd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:122px;min-height:50px;padding:4px 14px;
  background:#56663a;border:1px solid var(--edge);border-bottom-width:3px;border-radius:3px;font-family:var(--font-display);font-size:17px;
  touch-action:none;user-select:none;-webkit-user-select:none;align-self:start}
.cmd small{font-family:var(--font-body);font-size:11px;color:#cfd3a8;font-weight:500}
.cmd.held{background:var(--stencil);color:#1c2110;border-bottom-width:1px;transform:translateY(2px)}
.cmd.held small{color:#3a3a10}
.cmd.auto{box-shadow:inset 0 0 0 2px rgba(243,194,43,.55)}
@media (hover:none){.cmd small{display:none}}

#info{margin-block:0;color:var(--khaki-dim);font-size:14px;min-height:1.4em;text-align:center}
#info b{color:var(--khaki);font-weight:600}
#info .price{color:var(--stencil);white-space:nowrap}

/* ---- sheets (title, armory, help, pause, results) ---- */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(15,19,10,.74);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#modal.open{display:flex}
#modal.title{background:rgba(15,19,10,.5)}
.sheet{position:relative;width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid #0e120a;border-radius:5px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);padding:22px 22px 20px}
.sheet.wide{max-width:760px}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-radius:5px 5px 0 0;
  background:repeating-linear-gradient(-45deg,var(--stencil) 0 12px,#1c2110 12px 24px)}
.sheet h2{margin:6px 0 4px;font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05;color:var(--khaki);text-wrap:balance}
.sheet h3{margin:16px 0 4px;font-size:15px;font-weight:700;color:var(--stencil)}
.sheet p{margin:0 0 8px;max-width:62ch}
.sheet .lead{color:var(--khaki-dim)}
.sheet ul{margin:0 0 8px;padding-left:18px} .sheet li{margin:2px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{min-height:44px;padding:8px 18px;background:#56663a;border:1px solid var(--edge);border-bottom-width:3px;border-radius:3px;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--stencil);color:#1c2110;font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:.02em}
.btn.quiet{background:transparent}
.btn.buy{background:transparent;border-color:var(--stencil);color:var(--stencil);font-weight:700}
.btn.buy:hover{background:rgba(243,194,43,.12);filter:none}
.btn.danger{border-color:#7a2b1c;color:#ffb3a3}
.btn:disabled{opacity:.5;cursor:default;filter:none}
kbd{display:inline-block;min-width:1.5em;padding:0 5px;border:1px solid var(--khaki-dim);border-bottom-width:2px;border-radius:3px;font:inherit;font-size:12.5px;text-align:center}

/* title card */
.title-card{text-align:left}
.title-card h1{margin:8px 0 2px;font-family:var(--font-display);font-weight:400;font-size:clamp(40px,12vw,68px);line-height:.92;color:var(--stencil);letter-spacing:.01em}
.title-card .lead{font-size:16px;max-width:36ch}
.sheet .records{margin:14px 0 0;color:var(--khaki-dim);font-size:13.5px}
.sheet .records+.records{margin-top:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:12px 0 2px}
.stat{background:#2f3a23;border:1px solid var(--edge);border-radius:3px;padding:7px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:var(--khaki)}
.stat span{font-size:12.5px;color:var(--khaki-dim)}

/* armory */
.boss-note{margin:12px 0 0;padding:9px 12px;border-left:4px solid var(--signal);background:#3a2a1f;font-size:14px}
.boss-note b{color:#ffb3a3}
.troop.ab{box-shadow:0 0 0 2px #ffd54f,0 0 12px rgba(255,213,79,.8);animation:abglow 1s ease-in-out infinite alternate}
@keyframes abglow{to{box-shadow:0 0 0 2px #ffd54f,0 0 4px rgba(255,213,79,.3)}}
@media (prefers-reduced-motion:reduce){.troop.ab{animation:none}}
#info .abil{color:var(--khaki-dim)}#info .abil.on{color:#ffd54f;font-weight:700}
.launcher-pick{border-left-color:var(--stencil);background:#2f3a23}.launcher-pick b{color:var(--stencil)}.launcher-pick .offers{margin-top:8px}
.bankline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:2px 0 12px;color:var(--khaki-dim)}
.bankline .money{font-family:var(--font-display);font-size:26px;color:var(--stencil);line-height:1}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.offer{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;align-content:start;background:#2f3a23;border:1px solid var(--edge);border-radius:3px;padding:10px}
.offer.super{border-color:var(--stencil)}
.offer canvas{width:52px;height:52px;grid-row:1/3}
.offer .nm{font-weight:700;font-size:16px;line-height:1.15;align-self:end}
.offer .kind{font-size:12px;color:var(--khaki-dim);align-self:start}
.offer.super .kind{color:var(--stencil)}
.offer .desc{grid-column:1/3;font-size:13.5px;color:var(--khaki);margin:2px 0 0}
.offer .meta{grid-column:1/3;font-size:12.5px;color:var(--khaki-dim)}
.offer .btn{grid-column:1/3;margin-top:4px;min-height:40px}
.offer.done{opacity:.6}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:8px;height:8px;border:1px solid var(--stencil);border-radius:1px}
.pips i.on{background:var(--stencil)}
.squad{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.squad>span{display:flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;background:#2f3a23;border:1px solid var(--edge);border-radius:3px;font-size:13px}
.squad canvas{width:24px;height:24px}

/* help */
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin-top:6px}
.guide div{display:grid;grid-template-columns:30px 1fr;gap:0 8px;font-size:13px;color:var(--khaki-dim)}
.guide canvas{width:30px;height:30px;grid-row:1/3}
.guide b{color:var(--khaki);font-size:14px}
.guide .c{color:var(--stencil);font-weight:500;white-space:nowrap}

/* ---- phones, upright ---- */
@media (max-width:640px){
  #app{grid-template-columns:1fr 1fr;grid-template-areas:"hud hud" "stage stage" "retreat advance" "bar bar" "info info"}
  #hud{gap:5px}
  .tag.level{order:1}.hud-btns{order:2;margin-left:auto;gap:5px}.hud-break{display:block;order:3;flex-basis:100%;height:0}
  .tag.launches{order:4}.tag.coins{order:5}.tag.base{order:6;flex:1;min-width:0}.tag.bank{order:7}.hud-gap{display:none}
  .tag{height:32px;padding:0 8px;gap:5px}
  .tag.launches .lbl{display:none}
  .meter{flex:1;width:auto;min-width:24px}
  .icon-btn{width:34px;height:32px}
  .tag.level .stencil{font-size:19px}
  #field{border-left:0;border-right:0;border-radius:0}
  #bar{margin-inline:16px;gap:5px;justify-content:flex-start}
  .troop{flex:0 0 calc(12.5% - 4.4px);width:auto;padding:3px 0 2px;min-width:0}
  .troop canvas{width:28px;height:28px}
  .troop .cost{font-size:11px}
  .troop.sep{margin-left:0}
  #info{font-size:13px;min-height:2.7em;text-align:left}
  #btnRetreat{margin-left:16px;margin-right:0}#btnAdvance{margin-right:16px;margin-left:0}
  .cmd{min-width:0;width:auto;min-height:48px;align-self:stretch}
  .sheet{padding:20px 16px 16px}.sheet h2{font-size:26px}
  #modal.title{align-items:flex-end}
  .offers{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:359px){
  .tag.level .of,#btnFull,.tag.base .lbl{display:none}
  .tag{padding:0 6px}#hud{gap:4px}.hud-btns{gap:4px}
  .troop .cost{font-size:10px}.troop canvas{width:24px;height:24px}
}
/* ---- phones, on their side: commands flank the battlefield ---- */
@media (orientation:landscape) and (max-height:520px){
  body{padding-top:calc(env(safe-area-inset-top,0px) + 4px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px)}
  #app{gap:5px;max-width:none;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"hud hud hud" "retreat stage advance" "bar bar bar"}
  #hud{gap:5px;flex-wrap:nowrap;margin-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px))}
  .tag.level{order:1}.tag.launches{order:2}.hud-gap{display:block;order:3;flex:1}.tag.coins{order:4}.tag.base{order:5;flex:none}.tag.bank{order:6}.hud-btns{order:7;margin-left:0;gap:5px}.hud-break{display:none}
  .tag{height:28px;padding:0 8px;gap:5px}.icon-btn{width:32px;height:28px}
  .tag.level .of,.tag.launches .lbl,.tag.base .lbl{display:none}
  .meter{width:70px;flex:none}
  #info{grid-area:bar;display:none}
  #field{border:2px solid var(--edge);border-radius:4px}
  .cmd{align-self:stretch;min-width:72px;width:72px;min-height:0;padding:4px;font-size:14px;margin:0}
  #btnRetreat{margin-left:max(8px,env(safe-area-inset-left,0px));margin-right:0}#btnAdvance{margin-right:max(8px,env(safe-area-inset-right,0px));margin-left:0}
  #bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));padding-bottom:2px;gap:5px}
  .troop{flex:none;width:42px;padding:2px 0 1px}
  .troop canvas{width:24px;height:24px}
  .troop .cost{font-size:10.5px}
  .troop.sep{margin-left:6px}
}
@media (prefers-reduced-motion:reduce){
  #banner.show{animation:bannerCalm 2.6s linear forwards}
  @keyframes bannerCalm{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
  .tag.bump .num{animation:none}
  .meter span{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="tag level"><span id="hLevel" class="stencil">Level 1</span><span class="of" id="hOf">of 20</span></div>
    <div class="hud-btns">
      <button class="icon-btn" id="btnPause" type="button" aria-label="Pause" title="Pause (P)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
      <button class="icon-btn" id="btnFast" type="button" aria-label="Double speed" aria-pressed="false" title="Double speed (F)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.5 8 8l-7 5.5zM8 2.5 15 8l-7 5.5z"/></svg></button>
      <button class="icon-btn" id="btnSound" type="button" aria-label="Sound" title="Sound on or off (M)"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="icoSound" d=""/></svg></button>
      <button class="icon-btn" id="btnFull" type="button" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z"/></svg></button>
      <button class="icon-btn" id="btnHelp" type="button" aria-label="How to play" title="How to play (H)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2a4 4 0 0 0-4 3.9h2.2A1.8 1.8 0 0 1 8 3.3c1 0 1.7.6 1.7 1.5 0 .7-.4 1.1-1.2 1.7C7.4 7.4 6.9 8.2 6.9 9.6v.6h2.2v-.4c0-.8.3-1.2 1.1-1.8 1-.8 1.8-1.6 1.8-3.1 0-2.1-1.7-3.7-4-3.7zM6.8 11.8h2.4v2.4H6.8z"/></svg></button>
    </div>
    <span class="hud-break"></span>
    <div class="tag launches" id="tagLaunch" title="Soldiers you can still launch this level">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 0 0-6 6v1h12V8a6 6 0 0 0-6-6zM1 10.5h14v1.6H1zM4 13h8v1.5H4z"/></svg>
      <span id="hLaunch" class="num">7</span><span class="lbl">launches</span>
    </div>
    <span class="hud-gap"></span>
    <div class="tag coins" id="tagCoins" title="Coins: earned and spent inside this level"><span class="lbl">Coins</span><span id="hCoins" class="num">$60</span></div>
    <div class="tag base" id="tagBase" title="Base health. The level is lost at zero."><span class="lbl">Base</span><span class="meter"><span id="hBaseFill"></span></span><span id="hBase" class="num">100</span></div>
    <div class="tag bank" id="tagBank" title="Bank: carried between levels and spent in the armory"><span class="lbl">Bank</span><span id="hBank" class="num">$0</span></div>
  </header>

  <main id="stage">
    <div id="field">
      <canvas id="c" width="1200" height="500" role="img" aria-label="Battlefield: your launcher on the left, the enemy fortress on the right"></canvas>
      <div id="banner" aria-live="polite"><span class="big"></span><br><span class="sub"></span></div>
      <div id="hint" role="status"></div>
    </div>
  </main>

  <button class="cmd" id="btnRetreat" type="button" aria-label="Retreat: hold to pull troops back">&#9664; Retreat<small>hold A or &larr;</small></button>
  <div id="bar" role="toolbar" aria-label="Troops and structures"></div>
  <button class="cmd" id="btnAdvance" type="button" aria-label="Advance: hold to push troops forward">Advance &#9654;<small>hold D or &rarr;</small></button>
  <p id="info"></p>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet" id="sheet"></div></div>

<script>
// Siege Breaker
// One file, no libraries. The sections below are numbered; start with section 1 (TUNING)
// if you want to change how the game plays.
'use strict';
// =====================================================================

// ---- Rule switches -------------------------------------------------
// These change how the game plays compared with the first version.
const RULES = {
  // What happens to a soldier that comes to rest on top of the fortress?
  //   'lost'   it is stuck for STUCK_SECONDS (below) with the launcher waiting, then it is lost
  //   'fight'  it becomes a troop right there, and drops when the block under it breaks
  onFortress: 'lost',
  // Enemy soldiers aim at the troop they are targeting. Before, they always aimed at ground
  // height, so they could never hit a Drone or Helicopter Commander.
  aimAtTarget: true,
  // One enemy bullet damages one thing. Before (and still, while this is false), a bullet
  // hurts every troop or turret standing on the same spot.
  oneHitPerBullet: false,
  // Small consistency fixes: marked enemies take triple damage from everything (bombs, impacts
  // and burning included), a rocket explodes once, a Bomber that rolls to a stop blows up
  // instead of fizzling, and the Drone / Helicopter aura speeds up turrets too.
  smallFixes: true,
};

// accident, and that wait was most of what made the game hard. 0.5 makes the game much easier,
// 10 is the old difficulty. The README has test results for several values.
const STUCK_SECONDS = 3;

// Levels 7 to 15 are built by this recipe: pyramids with the core on top, turrets beside it,
// an iron base, and more iron the further you get.
for (let k = 0; k < 9; k++) {       // levels 7-15
  const cols = 9 + (k % 3) * 2, height = 5 + (k >> 1), mid = cols >> 1, rows = [];
  for (let r = 0; r < height; r++) {
    const fromBottom = height - 1 - r, halfWidth = Math.max(1, mid - fromBottom);
    let s = '';
    for (let x = 0; x < cols; x++) {
      const d = Math.abs(x - mid);
      let ch = ' ';
      if (d <= halfWidth) {
        ch = (fromBottom === 0 || (fromBottom < 1 + (k >> 1) && (x + fromBottom) % 2 === 0)) ? 'I' : ((x + fromBottom + k) % 3 === 0 ? 'S' : 'W');
        if (r === 0) ch = d === 0 ? 'C' : ((k > 1 || x < mid) ? 'T' : 'S');
      }
      s += ch;
    }
    rows.push(s);
  }
  GRASS_LEVELS.push({ launches: 10 + (k >> 1), spawnEvery: 300 - k * 12, maxEnemies: Math.min(7, 5 + (k >> 1)), rows });
}

// Which enemy types can appear from which level (lvl 0 = level 1), and how often.
function pickEnemyKind(lvl) {
  const w = worldOf(lvl), l = lvl % 30, r = Math.random();
  // each world's own enemies
  if (w === 1 && l >= 3 && r < 0.08) return 'sm';           // Snowman Bomb from Snowlands level 4
  if (w === 1 && l >= 1 && r < 0.2) return 'sw';            // Snowballer from level 2
  if (w === 1 && r < 0.36) return 'sk';                     // Ski Trooper
  if (w === 2 && l >= 2 && r < 0.08) return 'sd';           // Shield Drone from Space level 3
  if (w === 2 && l >= 1 && r < 0.2) return 'bk';            // Blinker from level 2
  if (w === 2 && r < 0.36) return 'jp';                     // Jetpack Trooper
  lvl = l + WORLDS[w].enemyBoost;                           // later worlds have every older enemy type from the start
  return lvl >= 20 && Math.random() < 0.1 ? 'en'      // Engineer from level 21
       : lvl >= 18 && Math.random() < 0.12 ? 'md'     // Medic from level 19
       : lvl >= 13 && Math.random() < 0.15 ? 'sb'     // Shield Bearer from level 14
       : lvl >= 11 && Math.random() < 0.18 ? 'dr'     // Drone from level 12
       : lvl >= 8 && Math.random() < 0.2 ? 'rk'
       : lvl >= 5 && Math.random() < 0.25 ? 'sn'
       : lvl >= 3 && Math.random() < 0.3 ? 'hv'
       : 'rf';
}

// Demolitions Expert: run in, plant a charge, run back, wait, repeat. Sets s.dmDir.
function demoMove(s) {
  s.dc = (s.dc || 0) - 1;
  const gap = fortressGap(s), threat = enemies.some(e => !e.air && Math.abs(e.x - s.x) < 220);
  if (threat) s.mode = 'back';
  if (s.mode === 'back') {
    s.dmDir = gap < DEMO.backOff ? -1 : 0;
    if (gap >= DEMO.backOff && !threat && s.dc <= 0) s.mode = 'go';
  } else {
    s.dmDir = gap > 3 ? 1 : 0;
    if (gap <= 3) {
      charges.push({ x: s.x + s.r + 4, y: s.y, t: DEMO.fuse, m: 1 + 0.3 * upLevel('demo') });
      emit('plant', s);
      s.mode = 'back'; s.dc = DEMO.every;
    }
  }
}
function updateTNT() {
  const now = tntQueue.filter(k => --k.t <= 0);
  tntQueue = tntQueue.filter(k => k.t > 0);
  for (const k of now) {
    const X = k.big ? REACTOR : TNT;
    for (const b of blocks) {
      const d = Math.hypot(b.x + 15 - k.x, b.y + 15 - k.y);
      if (d < X.radius) damageBlock(b, X.blockDamage * (0.3 + 0.7 * (1 - d / X.radius)), 'explosive');
    }
    for (const e of enemies) if (Math.hypot(e.x - k.x, e.y - k.y) < X.radius) damageEnemy(e, X.enemyDamage, true, 'explosive');
    emit(k.big ? 'reactor' : 'bomb', k.x, k.y);
  }
}
function updateCharges() {
  for (const k of charges) {
    if (--k.t > 0) continue;
    for (const b of blocks) {
      const d = Math.hypot(b.x + 15 - k.x, b.y + 15 - k.y);
      if (d < DEMO.radius) damageBlock(b, DEMO.blockDamage * k.m * (0.25 + 0.75 * (1 - d / DEMO.radius)), 'explosive');
    }
    for (const e of enemies) if (Math.hypot(e.x - k.x, e.y - k.y) < DEMO.radius) damageEnemy(e, DEMO.enemyDamage * k.m, true, 'explosive');
    emit('bomb', k.x, k.y);
  }
  charges = charges.filter(k => k.t > 0);
}
// Ghost: one shot that goes through every enemy in a line and stops at the first block.
function ghostShot(s) {
  const dx = Math.cos(s.aim), dy = Math.sin(s.aim), hit = new Set();
  let x = s.x + dx * 14, y = s.y - 4 + dy * 14;
  const x0 = x, y0 = y;
  for (let i = 0; i < 130; i++) {
    x += dx * 6; y += dy * 6;
    if (x > W + 10 || y > GROUND_Y || y < -10) break;
    const b = blocks.find(b => !b.dead && x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h);
    if (b) { damageBlock(b, GHOST.damage, 'bullet'); break; }
    for (const e of enemies) if (!hit.has(e) && Math.abs(e.x - x) < (e.boss ? BOSSES[e.k].radius : 12) && Math.abs(e.y - y) < (e.boss ? BOSSES[e.k].radius : 12)) { hit.add(e); damageEnemy(e, GHOST.damage, true, 'bullet'); }
  }
  emit('ghostShot', x0, y0, x, y);
}
// Hacker and Netrunner: no gun, they hack enemy soldiers and turrets.
function updateHacker(s) {
  const net = s.t === 'netrunner', range = TROOPS[s.t].range;
  const hackable = [];
  for (const e of enemies) if (!(e.hk > 0) && Math.hypot(e.x - s.x, e.y - s.y) < range) hackable.push({ d: Math.abs(e.x - s.x), en: e, x: e.x, y: e.y });
  for (const b of blocks) if (b.t === 'T' && !(b.hk > 0) && Math.hypot(b.x + 15 - s.x, b.y + 15 - s.y) < range) hackable.push({ d: Math.hypot(b.x + 15 - s.x, b.y + 15 - s.y) + 1000, b, x: b.x + 15, y: b.y + 15 });
  hackable.sort((a, b) => a.d - b.d);
  s.has = hackable.length > 0; s.aim = s.has ? Math.atan2(hackable[0].y - s.y, hackable[0].x - s.x) : 0;
  if (--s.cool > 0 || !s.has) return;
  s.cool = net ? NETRUNNER.every : HACK.every;
  const time = net ? NETRUNNER.time : HACK.time + HACK.perLevel * upLevel('hacker');
  for (const h of hackable.slice(0, net ? NETRUNNER.targets : 1)) {
    if (h.en) h.en.hk = time;
    else { h.b.hk = time; if (net) { h.b.turn = time; h.b.cd = 40; } }
    emit('hack', s, h);
  }
}

function fireWeapon(s, target) {
  const t = s.t;
  if (t === 'scout') {            // knife: hits straight away, no bullet
    s.cool = SCOUT.reload;
    const d = SCOUT.damage * (1 + 0.3 * upLevel('scout')) * dmgMult(s);
    if (target.en) damageEnemy(target.en, d, true, 'knife'); else damageBlock(target, d, 'knife');
    emit('fire', s, 'knife');
  } else if (t === 'ninja') {     // sword: hits every enemy around it
    s.cool = NINJA.reload;
    const d = NINJA.damage * dmgMult(s);
    let hit = false;
    for (const e of enemies) if (!e.air && Math.abs(e.x - s.x) < NINJA.reach + (e.boss ? BOSSES[e.k].radius : 0)) { damageEnemy(e, d, true, 'knife'); hit = true; }
    if (!hit && !target.en) damageBlock(target, d, 'knife');
    emit('fire', s, 'knife');
  } else if (t === 'inferno') {
    s.cool = 3;
    const a = s.aim + (Math.random() - 0.5) * 0.3;
    shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(a) * 7.5, vy: Math.sin(a) * 7.5, d: 4, l: 22, fl: 1, pi: 1, hits: [] });
    emit('fire', s, 'flame');
  } else if (t === 'breacher') {
    s.cool = BREACHER.reload;
    for (let i = 0; i < BREACHER.pellets; i++) { const a = s.aim + (Math.random() - 0.5) * 0.45, v = 10 + Math.random() * 3; shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(a) * v, vy: Math.sin(a) * v, d: BREACHER.damage, l: 20, bb: 1, vk: 'pel' }); }
    emit('fire', s, 'shotgun');
  } else if (t === 'gatling') {
    s.cool = GATLING.reload;
    s.barrel = !s.barrel;
    const a = s.aim + (Math.random() - 0.5) * 0.1;
    shots.push({ x: s.x, y: s.y - (s.barrel ? 1 : 7), vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, d: GATLING.damage, l: 60, ig: s.igT > 0, vk: 'mg' });
    emit('fire', s, 'minigun');
  } else if (t === 'missileer' || (t === 'skyguard' && target.en && target.en.air)) {   // homing missiles
    const sky = t === 'skyguard';
    s.cool = sky ? SKYGUARD.reload : MISSILEER.reload;
    for (let i = 0; i < (sky ? 2 : MISSILEER.missiles); i++) fireMissile(s, target, sky ? 14 : MISSILEER.damage, -1.2 - i * 0.35, sky ? SKYGUARD.airBonus : 0);
    emit('fire', s, 'rocket');
  } else if (t === 'grenadier') {
    s.cool = GRENADIER.reload;
    lob(s, target.x + 15, target.y + 15, GRENADIER.power * (1 + 0.3 * upLevel('grenadier')), 'grenade');
  } else if (t === 'javelin') {
    s.cool = JAVELIN.reload;
    lob(s, target.x + 15, target.y + 15, JAVELIN.power * (1 + 0.3 * upLevel('javelin')), 'javelin', 85);
  } else if (t === 'tesla') {
    s.cool = TESLA.reload;
    teslaZap(s, target, TESLA.jumps, dmgMult(s));
  } else if (t === 'crossbow') {
    s.cool = CROSSBOW.reload;
    fireBolt(s, s.aim);
  } else if (t === 'laser') {
    s.cool = LASER.reload;
    laserHit(s, LASER.damage * dmgMult(s));
  } else if (t === 'pyro') {
    s.cool = 3;
    const a = s.aim + (Math.random() - 0.5) * 0.35;
    shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(a) * 6.5, vy: Math.sin(a) * 6.5, d: 3.2, l: Math.round(15 * (1 + 0.2 * upLevel('pyro'))), fl: 1 });
    emit('fire', s, 'flame');
  } else if (t === 'sniper' || t === 'rocket' || t === 'ssniper') {
    const sniper = t !== 'rocket', marksman = t === 'ssniper', m = 1 + 0.3 * upLevel(t);
    if (marksman && target.en && !target.en.mk) { target.en.mk = 300; emit('mark', target.en); }   // marked for 5 seconds
    if (marksman && !target.en && target.t === 'T' && !(target.mk > 0)) { target.mk = 300; emit('mark', { x: target.x + 15, y: target.y + 15 }); }
    s.cool = marksman ? 70 : sniper ? 110 : 130;
    const v = sniper ? 20 : 7;
    shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(s.aim) * v, vy: Math.sin(s.aim) * v, d: (marksman ? 50 : sniper ? 38 : 20) * m, m, l: sniper ? 40 : 90, ex: !sniper, rk: !sniper, vk: sniper ? 'sn' : 'rk' });
    emit('fire', s, sniper ? 'sniper' : 'rocket');
  } else if (t === 'shotgun') {
    s.cool = s.sp > 0 ? 6 : 55;
    for (let i = 0; i < 6; i++) {
      const a = s.aim + (Math.random() - 0.5) * 0.5, v = 9 + Math.random() * 3;
      shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(a) * v, vy: Math.sin(a) * v, d: 7, l: Math.round(18 * (1 + 0.2 * upLevel('shotgun'))), vk: 'pel' });
    }
    emit('fire', s, 'shotgun');
  } else if (t === 'assault' || t === 'seal') {   // first round of a burst; the rest follow in updateTroop
    const W2 = t === 'seal' ? SEAL : ASSAULT;
    s.cool = W2.reload; s.burst = W2.burst - 1; s.bt = W2.gap;
    shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(s.aim) * 12, vy: Math.sin(s.aim) * 12, d: W2.damage, l: 50, vk: 'ar' });
    emit('fire', s, 'assault');
  } else if (isShield(t) || t === 'demo' || t === 'mines') {   // pistol
    s.cool = RIOT.reload;
    shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(s.aim) * 11, vy: Math.sin(s.aim) * 11, d: RIOT.pistol, l: 30, vk: 'pi' });
    emit('fire', s, 'rifle');
  } else if (t === 'flak' || t === 'skyguard') {
    s.cool = FLAK.reload;
    const dist = Math.hypot(target.x + 15 - s.x, target.y + 15 - s.y);
    shots.push({ x: s.x, y: s.y - 6, vx: Math.cos(s.aim) * FLAK.speed, vy: Math.sin(s.aim) * FLAK.speed, d: FLAK.damage * (1 + 0.3 * upLevel('flak')), l: Math.max(3, Math.round(dist / FLAK.speed)), flak: 1 });
    emit('fire', s, 'flakShot');
  } else if (t === 'cryo' || t === 'frostbite') {
    const fb = t === 'frostbite';
    s.cool = CRYO.reload;
    const a = s.aim + (Math.random() - 0.5) * 0.25;
    shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(a) * 7, vy: Math.sin(a) * 7, d: CRYO.damage * (fb ? 2 : 1), l: fb ? 36 : Math.round(28 * (1 + 0.2 * upLevel('cryo'))), cr: 1, fb, hits: [] });
    emit('fire', s, 'freeze');
  } else if (t === 'tank') {
    s.cool = TANK.reload;
    shots.push({ x: s.x + Math.cos(s.aim) * 22, y: s.y - 6 + Math.sin(s.aim) * 22, vx: Math.cos(s.aim) * 11, vy: Math.sin(s.aim) * 11, d: 25, m: TANK.power, l: 60, ex: true, rk: true, vk: 'tk' });
    emit('fire', s, 'tankShot');
  } else if (t === 'ghost') {
    s.cool = GHOST.reload;
    ghostShot(s);
  } else if (t === 'mortar') {
    s.cool = MORTAR_TEAM.reload;
    lob(s, target.x + 15, target.y + 15, MORTAR_TEAM.power, 'mortarShot');
  } else {   // Grunt rifle, Heavy minigun
    const minigun = t === 'heavy';
    s.cool = minigun ? 5 : (s.sp > 0 ? 8 : 40);
    const a = s.aim + (minigun ? (Math.random() - 0.5) * 0.12 : 0);
    shots.push({ x: s.x, y: s.y - 4, vx: Math.cos(a) * 11, vy: Math.sin(a) * 11, d: minigun ? (s.sp > 0 ? 6 : 4) : 14, l: 60, ig: minigun && (s.sp > 0 || s.igT > 0), vk: minigun ? 'mg' : 'ri' });
    emit('fire', s, minigun ? 'minigun' : 'rifle');
  }
}

// Medic and Commander: no gun, they follow whoever needs them.
function updateSupport(s) {
  const commander = s.t === 'commander' || s.t === 'general', mech = s.t === 'mechanic', surgeon = s.t === 'surgeon';
  let tx = null;
  let wounded = null;
  if (mech) wounded = repairTarget(s);
  else if (!commander) {
    for (const a of soldiers) {
      if (a.gnd && a !== s && a.t !== 'medic' && a.t !== 'surgeon' && a.hp < TROOPS[a.t].hp && (!wounded || Math.abs(a.x - s.x) < Math.abs(wounded.x - s.x))) wounded = a;
    }
  }
  if (wounded) tx = wounded.x - 25;
  else if (baseHp < BASE_HP && !commander && !mech) tx = LAUNCHER.x + 45;
  else {
    const front = frontmost(a => a.gnd && a !== s && a.t !== 'medic' && a.t !== 'sniper' && a.t !== 'ssniper' && a.t !== 'mortar');
    tx = front ? front.x - 45 : LAUNCHER.x + 45;
  }
  const dd = tx - s.x;
  s.dir = 0;
  if (Math.abs(dd) > 6) { s.dir = Math.sign(dd); walk(s, Math.sign(dd) * 1.2); }
  if (mech) { if (++s.hc >= MECHANIC.every) { s.hc = 0; mechanicRepair(s); } return; }
  if (surgeon) {
    if (++s.hc >= SURGEON.every) {
      s.hc = 0; let healed = 0;
      for (const a of soldiers) if (a.gnd && a.hp < TROOPS[a.t].hp && Math.abs(a.x - s.x) < SURGEON.reach) { a.hp = Math.min(TROOPS[a.t].hp, a.hp + SURGEON.heal); healed = 1; }
      if (baseHp < BASE_HP && Math.abs(s.x - LAUNCHER.x) < 160) { baseHp = Math.min(BASE_HP, baseHp + 8); healed = 1; }
      if (healed) emit('heal', s);
    }
    return;
  }
  if (!commander && ++s.hc >= 25) {   // a heal pulse every 25 frames
    s.hc = 0;
    let healed = 0;
    for (const a of soldiers) {
      if (a.gnd && a.hp < TROOPS[a.t].hp && Math.hypot(a.x - s.x, a.y - s.y) < 90) { a.hp = Math.min(TROOPS[a.t].hp, a.hp + 6 + 3 * upLevel('medic')); healed = 1; }
    }
    if (baseHp < BASE_HP && Math.abs(s.x - LAUNCHER.x) < 130) { baseHp = Math.min(BASE_HP, baseHp + 5); healed = 1; }
    if (healed) emit('heal', s);
  }
}

// Engineer builds turrets on the ground; Master Engineer throws minigun turrets ahead.
function updateEngineer(s) {
  const master = s.t === 'sengineer';
  const limit = master ? 3 : 5 + 2 * upLevel('engineer');
  if (--s.cool <= 0 && turrets.filter(t => !t.bt && !!t.mg === master).length < limit) {
    s.cool = master ? 300 : 420;
    let t;
    if (master) t = { x: Math.min(s.x + 90, fortX - 30), y: GROUND_Y - 90, hp: 80, cool: 10, a: 0, mg: 1 };
    else {
      t = { x: s.x + 22, y: GROUND_Y - 10, hp: 45, cool: 30, a: 0 };
      // An Engineer standing on the fortress builds where it stands.
      if (roofRule() && s.y + s.r < GROUND_Y - 1) { t.y = s.y + s.r - 10; if (hitsBlock(t.x, t.y, 9)) t.x = s.x; }
    }
    turrets.push(t);
    emit('build', t, s);
  }
}

// A soldier in the air: gravity, bouncing off blocks, bounce pads, the ground.
function updateFlight(s) {
  s.life++; s.vy += GRAVITY; s.x += s.vx; s.y += s.vy;
  let restingOnBlock = false;
  for (const b of blocks) {
    if (b.dead || s.dead) continue;
    const cx = clamp(s.x, b.x, b.x + b.w), cy = clamp(s.y, b.y, b.y + b.h);
    let dx = s.x - cx, dy = s.y - cy, d = Math.hypot(dx, dy);
    if (d < s.r) {
      const speed = Math.hypot(s.vx, s.vy);
      if (s.t === 'bomber') { explodeBomber(s); break; }
      if (speed > 2) { damageBlock(b, speed * s.dmg, 'impact'); emit('impact', s, speed, b); }
      if (d === 0) { dx = -s.vx; dy = -s.vy; d = Math.hypot(dx, dy) || 1; }
      const nx = dx / d, ny = dy / d;
      s.x = cx + nx * s.r; s.y = cy + ny * s.r;
      const dot = s.vx * nx + s.vy * ny;
      if (dot < 0) { s.vx -= 1.5 * dot * nx; s.vy -= 1.5 * dot * ny; }
      s.vx *= 0.6; s.vy *= 0.6;
      if (ny < -0.7 && Math.abs(s.vy) < 1 && Math.abs(s.vx) < 0.6) restingOnBlock = true;
    }
  }
  if (s.dead) return;
  s.perch = restingOnBlock ? (s.perch || 0) + 1 : 0;          // frames spent sitting still on top of a block
  // Slamming into an enemy soldier hurts it.
  for (const e of enemies) {
    if (Math.hypot(s.x - e.x, s.y - e.y) < s.r + (e.boss ? BOSSES[e.k].radius : 10)) {
      const speed = Math.hypot(s.vx, s.vy);
      if (speed > 3) damageEnemy(e, speed * s.dmg * 2.5, RULES.smallFixes, 'impact');
    }
  }
  for (const p of pads) {
    if (s.vy > 0 && (s.pads || 0) < PAD.maxBounces && s.x > p.x && s.x < p.x + p.w && s.y + s.r > p.y && s.y + s.r < p.y + p.h + 12) {
      s.pads = (s.pads || 0) + 1;
      s.vy = -clamp(Math.abs(s.vy) * PAD.keep, PAD.min, PAD.max); s.vx *= PAD.push; s.y = p.y - s.r;
      emit('pad', p);
    }
  }
  if (s.y + s.r > GROUND_Y) {
    if (s.t === 'bomber' && s.x > 450) { explodeBomber(s); return; }
    if (s.vy > 2.5) emit('thud', s.x, GROUND_Y);
    s.y = GROUND_Y - s.r; s.vy *= -0.4; s.vx *= 0.8;
    if (Math.abs(s.vy) < 1 && Math.abs(s.vx) < 0.6) s.rest++;
  }
  // Come to rest: a Bomber goes off, everyone else becomes a troop.
  if (s.rest > 25 && s.t === 'bomber' && RULES.smallFixes) { explodeBomber(s); return; }
  const perched = RULES.onFortress === 'fight' ? s.perch > 25 : RULES.onFortress === 'lost' && s.perch > STUCK_SECONDS * 60;
  if (perched && RULES.onFortress === 'lost') { s.dead = 1; stats.lost++; emit('lost', s, 'fortress'); return; }
  if ((s.rest > 25 || perched) && s.t !== 'bomber') {
    s.gnd = 1; s.hp = TROOPS[s.t].hp; s.hc = 0; s.ac = 0; s.cool = 10; s.vx = s.vy = 0;
    if (!perched) s.y = GROUND_Y - s.r;
    emit('landed', s);
  }
  if (s.rest > 50 || s.x > W + 40 || s.x < -40 || s.life > 700) { s.dead = 1; stats.lost++; emit('lost', s); }
}

// ---------------------------------------------------------------- enemy bullets
function updateEnemyShots() {
  const one = RULES.oneHitPerBullet;
  for (const u of enemyShots) {
    if (!u.ls) u.vy += 0.04;              // lasers fly straight
    u.x += u.vx; u.y += u.vy;
    for (const q of barricades) {
      if (one && u.dead) break;
      if (u.x > q.x && u.x < q.x + q.w && u.y > q.y && u.y < q.y + q.h) { q.hp -= 20; u.dead = 1; emit('structHit', u.x, u.y); }
    }
    if (!u.dead) for (const p of pads) {
      if (one && u.dead) break;
      if (u.x > p.x && u.x < p.x + p.w && u.y > p.y && u.y < p.y + p.h) { p.hp -= 20; u.dead = 1; }
    }
    if (!u.dead) for (const s of soldiers) {              // a Riot Shield blocks bullets coming from the front
      if (s.gnd && isShield(s.t) && !s.dead && u.vx < 0 && inShield(s, u.x, u.y)) {
        const dm = u.dm || TURRET_BLOCK.damageToTroops;
        if (s.t === 'bastion') {                         // bounces the bullet back at the enemy
          hurtTroop(s, dm * BASTION.takes);
          shots.push({ x: u.x + 4, y: u.y, vx: -u.vx * 1.6, vy: -u.vy * 0.5, d: dm * BASTION.reflect, l: 60, vk: 'ri' });
        } else hurtTroop(s, dm * shieldTakes());
        u.dead = 1; emit('shieldBlock', u.x, u.y); break;
      }
    }
    if (!u.dead) for (const s of soldiers) {
      if (one && u.dead) break;
      if (s.gnd && Math.hypot(u.x - s.x, u.y - s.y) < s.r + 5) {
        if (s.t === 'ninja' && (u.dodged === s || (u.dodged === undefined && Math.random() < NINJA.dodge && (u.dodged = s)))) continue;   // dodged
        if (u.dodged === undefined) u.dodged = null;
        s.hp -= (u.dm || TURRET_BLOCK.damageToTroops) * (TROOPS[s.t].armor ?? 1) * (guarded(s) ? SURGEON.guard : 1) * (s.tn > 0 ? 0.5 : 1) * DIFFICULTY.damageTaken; s.flash = 5; u.dead = 1;
        if (u.fz) { s.fz = Math.max(s.fz || 0, u.fz); emit('frozen', s); }
        emit('troopHit', s, u);
        if (s.hp <= 0 && !s.dead) { s.dead = 1; stats.lost++; emit('troopDown', s); }
      }
    }
    if (!u.dead) for (const t of turrets) {
      if (one && u.dead) break;
      if (Math.abs(u.x - t.x) < 12 && u.y > t.y - 14 && (!roofRule() || u.y < t.y + 14)) {
        t.hp -= (u.dm || TURRET_BLOCK.damageToTroops) * DIFFICULTY.damageTaken; u.dead = 1;
        emit('turretHit', t, u);
      }
    }

// ---------------------------------------------------------------- your bullets, rockets, flames

// ---------------------------------------------------------------- enemy soldiers

    const taunt = soldiers.find(s => s.gnd && s.tn > 0 && !s.dead);               // a Bastion's Taunt pulls all fire

// Snowman Bomb: runs at the nearest troop (or a barricade, or your base) and blows up.

// ---------------------------------------------------------------- bosses

// ---------------------------------------------------------------- one frame of the battle
function update() {

  stepBlocks();
  moveParts();
  for (const b of blocks) {
    if (b.t === 'E' && !b.dead) { if (b.rg > 0) b.rg--; else if (b.hp < BLOCKS.E.hp) b.hp = Math.min(BLOCKS.E.hp, b.hp + ENERGY.regen); }
    if (b.bn > 0 && !b.dead) { b.bn--; damageBlock(b, INFERNO.blockBurn, 'flame'); }   // set on fire by an Inferno
  }
  for (const k of Object.keys(abilityCd)) if (abilityCd[k] > 0) abilityCd[k]--;
  updateTurretBlocks();
  updateSoldiers();
  updateEnemyShots();
  blocks = blocks.filter(b => !b.dead);
  updateShots();
  spawnEnemies();
  updateEnemies();
  updateTurrets();
  updateLauncher();
  updateMines();
  updateAirstrikes();
  updateCharges();
  updateTNT();
  // Win, lose, or keep going?
  if (!blocks.some(b => b.t === 'C')) finish(true);
  else if (baseHp <= 0) finish(false, 'Your base was destroyed.');
  else if (launchesLeft === 0 && !soldiers.some(s => !hasNoGun(s.t))) {
    if (++outOfTroopsTimer > 120) finish(false, 'Out of soldiers.');
  } else outOfTroopsTimer = 0;
}

function finish(won, reason) {
  if (state !== 'play') return;
  state = won ? 'win' : 'lose';
  outOfTroopsTimer = 0;
  if (won) bank += coins + WIN_BONUS + (WORLDS[worldOf(level + 1)] && worldOf(level + 1) > world ? WORLDS[worldOf(level + 1)].bonus : 0);
  emit(won ? 'win' : 'lose', reason);

// ---------------------------------------------------------------- the run and the armory
function newRun() {
  owned = {}; STARTING_TROOPS.forEach(t => owned[t] = 1);

  launcherUps = { loader: 0, auto: 0, shield: 0, guns: 0 }; launcherPicks = 0;
  loadLevel(0);
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Decide what the armory sells after a win: up to 3 troops you do not own, upgrades to fill
// empty slots, and one super troop after levels 5 and 10.
function rollOffers() {
  offers = shuffle(Object.keys(TROOPS).filter(k => TROOPS[k].price && !owned[k] && !TROOPS[k].super)).slice(0, 3);
  if (offers.length < 3) {
    offers = offers.concat(shuffle(Object.keys(owned).filter(t => TROOPS[t].upgrade && upLevel(t) < MAX_UPGRADE).map(t => 'up:' + t)).slice(0, 3 - offers.length));
  }
  if ((level + 1) % 5 === 0) {
    const supers = shuffle(Object.keys(TROOPS).filter(k => TROOPS[k].super && !owned[k]));
    offers.unshift(...supers.slice(0, SUPER_OFFERS));

function offerInfo(key) {

  const price = isUpgrade ? UPGRADE_COST(upLevel(troop)) : TROOPS[troop].price;
  const available = isUpgrade ? upLevel(troop) < MAX_UPGRADE : !owned[troop];
  return { key, troop, isUpgrade, price, available };
}

function emit(type, ...args) { const f = ON[type]; if (f) f(...args); }

// Runs every frame, also after the battle has ended, so explosions finish playing out.
function updateFx() {
  clock++;
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.l--;
    if (p.k === SMOKE) { p.vx *= 0.96; p.vy *= 0.97; }
  }
  parts = parts.filter(p => p.l > 0);
  for (const f of floaters) { f.y -= 0.6; f.l--; }
  floaters = floaters.filter(f => f.l > 0);
  shake *= 0.86; if (shake < 0.2) shake = 0;
  if (baseFlash > 0) baseFlash--;
  if (launcherKick > 0) launcherKick--;
  for (const b of beams) b.l--;
  beams = beams.filter(b => b.l > 0);
  for (const z of zaps) z.l--;
  zaps = zaps.filter(z => z.l > 0);
  if (state === 'play') {
    for (const k of strikes) if (k.t === 24) Sound.play('whistle');
    for (const s of soldiers) {
      if (s.perch === 13 && RULES.onFortress === 'lost') uiStuck();
      if (s.mf > 0) s.mf--;
      if (s.flash > 0) s.flash--;
      if (!s.gnd && s.life % 3 === 0 && trail.length < 140) trail.push(s.x, s.y);
      if (s.sp > 0 && clock % 5 === 0) addPart(SPARK, s.x, s.y - s.r, (Math.random() - 0.5) * 2, -1.5, 12, '#ffb74d', 2, 0);
    }
    for (const t of turrets) if (t.mf > 0) t.mf--;
    for (const b of blocks) { if (b.flash > 0) b.flash--; if (b.kick > 0) b.kick--; }
    for (const e of enemies) {
      if (e.flash > 0) e.flash--;
      if (e.mf > 0) e.mf--;
      if (e.bn > 0 && clock % 4 === 0) addPart(SQUARE, e.x + (Math.random() - 0.5) * 10, e.y - 6, 0, -1.2, 14, Math.random() < 0.5 ? '#ff7043' : '#ffca28', 4, 0);
    }
    for (const u of shots) if (u.rk && clock % 2 === 0) addPart(SMOKE, u.x - u.vx, u.y - u.vy, 0, -0.2, 16, 'rgba(230,230,230,1)', 3, 0);
    for (const u of enemyShots) if (u.rk && clock % 2 === 0) addPart(SMOKE, u.x - u.vx, u.y - u.vy, 0, -0.2, 16, 'rgba(90,80,80,1)', 4, 0);
  }
  if (state === 'play' && clock % 30 === 0) { const sig = BAR_ORDER.map(t => abilityReady(t) ? 1 : 0).join(''); if (sig !== abilityBarSig) { abilityBarSig = sig; syncBar(); } }
  if (endTimer > 0 && --endTimer === 0) uiBattleOver();
}

//  5. DRAWING — everything on the battlefield canvas.
//     All coordinates are world units (1200 x 500); the canvas is scaled to fit the screen.
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let pxScale = 1;        // canvas pixels per world unit
let cssScale = 1;       // screen pixels per world unit (keeps floating text readable on phones)
let backdrop = null;    // sky, hills and ground, painted once per resize

const clouds = [0, 1, 2, 3, 4, 5, 6].map(i => ({ x: i * 210 + Math.random() * 90, y: 45 + Math.random() * 120, s: 0.7 + Math.random() * 0.7, v: 0.05 + Math.random() * 0.08 }));

// Each world has its own look: 'grass', 'snow' or 'space'.
const theme = () => WORLDS[world].key;
const flakes = [...Array(105)].map(() => ({ x: Math.random() * 1200, y: Math.random() * 460, v: 0.35 + Math.random() * 0.6, s: 0.8 + Math.random() * 1.8, p: Math.random() * 6.3 }));
const twinkles = [...Array(34)].map(() => ({ x: Math.random() * 1200, y: Math.random() * 330, p: Math.random() * 6.3, s: 1 + Math.random() * 1.2 }));
let backdropTheme = null;
function paintBackdrop() {
  // One background canvas, reused on every resize. Making a new one each time used up
  // phones' canvas memory (iPhone and iPad cap it), and then the battlefield went blank blue.
  if (!backdrop) backdrop = document.createElement('canvas');
  backdrop.width = cv.width; backdrop.height = cv.height; backdropTheme = theme();
  const c = backdrop.getContext('2d');
  c.setTransform(pxScale, 0, 0, pxScale, 0, 0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const hills = (base, amp, f, ph, color) => {
    c.fillStyle = color; c.beginPath(); c.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 6) c.lineTo(x, base - amp * (0.6 * Math.sin(x * f + ph) + 0.4 * Math.sin(x * f * 2.3 + ph * 2)));
    c.lineTo(W, GROUND_Y); c.fill();
  };
  const sky = (top, bottom) => { const g = c.createLinearGradient(0, 0, 0, GROUND_Y); g.addColorStop(0, top); g.addColorStop(1, bottom); c.fillStyle = g; c.fillRect(0, 0, W, H); };
  const t = backdropTheme;
  if (t === 'snow') {
    sky('#9fb8cf', '#e9f1f7');
    // far mountains with snowy peaks
    const peaks = [[40, 250], [160, 210], [290, 262], [420, 200], [560, 240], [700, 205], [840, 250], [970, 225], [1100, 255], [1230, 215]];
    c.fillStyle = '#b7c9d9'; c.beginPath(); c.moveTo(0, 420);
    for (const [x, y] of peaks) { c.lineTo(x - 70, 420); c.lineTo(x, y); c.lineTo(x + 70, 420); }
    c.lineTo(W, 420); c.fill();
    c.fillStyle = '#f7fbff';
    for (const [x, y] of peaks) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + 22, y + 34); c.lineTo(x + 10, y + 28); c.lineTo(x, y + 38); c.lineTo(x - 12, y + 27); c.lineTo(x - 22, y + 34); c.fill(); }
    hills(410, 16, 0.013, 2.1, '#dbe7f0');
    // pine trees with snow on them
    for (let i = 0; i < 26; i++) {
      const x = rnd() * W, s = 0.6 + rnd() * 0.7, base = 428 + rnd() * 10;
      c.fillStyle = '#41604f';
      for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(x, base - (34 - k * 9) * s - 8 * s); c.lineTo(x - (12 - k * 2) * s, base - k * 9 * s); c.lineTo(x + (12 - k * 2) * s, base - k * 9 * s); c.fill(); }
      c.fillStyle = 'rgba(255,255,255,.85)';
      for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(x, base - (34 - k * 9) * s - 8 * s); c.lineTo(x - 5 * s, base - (24 - k * 9) * s); c.lineTo(x + 5 * s, base - (24 - k * 9) * s); c.fill(); }
    }
    hills(436, 7, 0.02, 0.6, '#eef4f9');
    c.fillStyle = '#f4f8fb'; c.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    c.fillStyle = '#ffffff'; c.fillRect(0, GROUND_Y, W, 3);
    c.fillStyle = '#c9d8e4'; c.fillRect(0, GROUND_Y + 12, W, 3);
    c.fillStyle = '#7d8f9f'; c.fillRect(0, GROUND_Y + 15, W, H);
    for (let i = 0; i < 70; i++) { c.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,.25)' : 'rgba(40,60,80,.18)'; c.fillRect(rnd() * W, GROUND_Y + 18 + rnd() * 30, 2 + rnd() * 4, 2 + rnd() * 2); }
    c.fillStyle = 'rgba(150,180,205,.35)';
    for (let i = 0; i < 26; i++) { c.beginPath(); c.ellipse(rnd() * W, GROUND_Y + 6 + rnd() * 4, 10 + rnd() * 26, 2, 0, 0, 7); c.fill(); }
  } else if (t === 'space') {
    sky('#04050d', '#171d3a');
    for (const [x, y, r, col] of [[200, 120, 200, 'rgba(126,87,194,.22)'], [620, 260, 230, 'rgba(0,150,170,.16)'], [420, 60, 150, 'rgba(236,64,122,.12)']]) {
      const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, GROUND_Y);

    for (let i = 0; i < 190; i++) { const r = rnd(); c.fillStyle = `rgba(255,255,255,${0.25 + rnd() * 0.7})`; c.fillRect(rnd() * W, rnd() * (GROUND_Y - 40), r < 0.85 ? 1 : 2, r < 0.85 ? 1 : 2); }

    c.strokeStyle = 'rgba(255,214,170,.35)'; c.lineWidth = 7; c.beginPath(); c.ellipse(px, py, pr * 1.8, pr * 0.42, -0.25, Math.PI, 2 * Math.PI); c.stroke();

    const mg = c.createRadialGradient(560, 70, 2, 565, 75, 18); mg.addColorStop(0, '#eceff1'); mg.addColorStop(1, '#607d8b'); c.fillStyle = mg; c.beginPath(); c.arc(565, 75, 18, 0, 7); c.fill();

    for (let i = 0; i < 40; i++) { c.fillStyle = rnd() < 0.5 ? 'rgba(0,229,255,.6)' : 'rgba(255,214,0,.5)'; c.fillRect(rnd() * W, GROUND_Y - 10 - rnd() * 60, 2, 2); }
    // the deck
    c.fillStyle = '#3b4352'; c.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    c.save(); c.beginPath(); c.rect(0, GROUND_Y, W, 5); c.clip();
    for (let x = -10; x < W; x += 16) { c.fillStyle = '#fbc02d'; c.beginPath(); c.moveTo(x, GROUND_Y + 5); c.lineTo(x + 8, GROUND_Y + 5); c.lineTo(x + 13, GROUND_Y); c.lineTo(x + 5, GROUND_Y); c.fill(); }

// ---------------------------------------------------------------- aiming and building

    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.setLineDash([8, 8]); c.beginPath(); c.moveTo(BUILD_ZONE_X, 0); c.lineTo(BUILD_ZONE_X, GROUND_Y); c.stroke(); c.setLineDash([]); c.lineWidth = 1;

      else drawPad(c, { x: pointer.x - 35, y: pointer.y - 5, w: PAD.w, h: PAD.h }, true);

    if (pulling) { c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(LAUNCHER.x - dx - 16, LAUNCHER.y - dy + 16, 9, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.stroke(); }

// ---------------------------------------------------------------- the whole frame
function draw() {
  const c = ctx;
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake * 2; sy = (Math.random() - 0.5) * shake * 2; }
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = theme() === 'space' ? '#05060f' : theme() === 'snow' ? '#a9c0d4' : '#7ec0ee'; c.fillRect(0, 0, cv.width, cv.height);
  if (backdrop && (backdrop.width !== cv.width || backdrop.height !== cv.height || backdropTheme !== theme())) paintBackdrop();   // sizes or world changed: repaint
  if (backdrop) c.drawImage(backdrop, Math.round(sx * pxScale), Math.round(sy * pxScale));
  c.setTransform(pxScale, 0, 0, pxScale, sx * pxScale, sy * pxScale);
  drawSky(c);
  drawLauncher(c);
  for (const p of pads) drawPad(c, p);
  for (const q of barricades) drawBarricade(c, q);
  drawRails(c);

  if (theme() === 'snow') drawSnowCaps(c);

  for (const m of mines) {                                   // land mines
    c.fillStyle = '#33691e'; c.beginPath(); c.ellipse(m.x, GROUND_Y - 1, 7, 3, 0, Math.PI, 0); c.fill(); c.fillStyle = '#212121'; c.fillRect(m.x - 7, GROUND_Y - 1, 14, 2);
    c.fillStyle = m.arm > 0 ? '#ffeb3b' : clock % 30 < 15 ? '#ff1744' : '#4a0000'; c.beginPath(); c.arc(m.x, GROUND_Y - 4, 1.5, 0, 7); c.fill();
  }
  for (const k of airstrikes) {                              // Radio Operator shells: a blue marker, then the shell falling
    const p = 1 - k.t / k.total;
    c.strokeStyle = `rgba(100,181,246,${0.4 + 0.5 * Math.abs(Math.sin(clock * 0.4))})`; c.lineWidth = 2; c.beginPath(); c.arc(k.x, k.y, 14 - 8 * p, 0, 7); c.moveTo(k.x - 18, k.y); c.lineTo(k.x + 18, k.y); c.moveTo(k.x, k.y - 18); c.lineTo(k.x, k.y + 18); c.stroke(); c.lineWidth = 1;
    if (k.t < 24) { const sy = k.y - k.t * 18; c.fillStyle = '#263238'; c.beginPath(); c.ellipse(k.x, sy, 4, 9, 0, 0, 7); c.fill(); c.fillStyle = '#ff7043'; c.beginPath(); c.arc(k.x, sy - 10, 2.5 + Math.random() * 1.5, 0, 7); c.fill(); }
  }
  for (const k of charges) {                                 // Demolitions charges with a blinking light
    c.fillStyle = '#b71c1c'; c.fillRect(k.x - 5, k.y - 6, 10, 12); c.fillStyle = '#212121'; c.fillRect(k.x - 5, k.y - 1, 10, 2);

  drawAim(c);
  drawParticles(c);
  drawBeams(c);
  drawSnowfall(c);
  drawFloaters(c);
  drawBossBar(c);
}

// Little pictures for buttons and cards: a troop, or a structure.
function drawPortrait(canvas, key) {
  const css = canvas.clientWidth || parseInt(canvas.dataset.size) || 34, dpr = Math.min(3, window.devicePixelRatio || 1);

// =====================================================================
//  6. SCREEN FURNITURE — top strip, troop bar, sheets (title, armory,

const $ = id => document.getElementById(id);
const STRUCTURES = {

// ---------------------------------------------------------------- saving (best effort: the game works without it)
const SAVE_KEY = 'siege-breaker.save.v2';
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ run: savedRun, best, muted: Sound.muted, musicOff: Sound.musicOff, tutorialDone })); } catch (e) { /* storage unavailable */ }
}
function readSave(d) {
  try {
    d = d || JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d) return;
    if (d.best) best = { level: +d.best.level || 0, wins: +d.best.wins || 0 };
    if (d.muted) Sound.setMuted(true);
    if (d.musicOff) Sound.setMusicOff(true);
    tutorialDone = !!d.tutorialDone;
    const r = d.run;
    if (r && Number.isInteger(r.level) && r.level >= 0 && r.level < LEVELS.length && r.owned && r.owned.grunt) {
      const ownedOk = {}; Object.keys(r.owned).forEach(k => { if (TROOPS[k]) ownedOk[k] = 1; });
      const upsOk = {}; Object.keys(r.upgrades || {}).forEach(k => { if (TROOPS[k] && TROOPS[k].upgrade) upsOk[k] = clamp(r.upgrades[k] | 0, 0, MAX_UPGRADE); });
      savedRun = { level: r.level, phase: r.phase === 'shop' ? 'shop' : 'level', owned: ownedOk, upgrades: upsOk, bank: Math.max(0, +r.bank || 0),
        launcherUps: Object.fromEntries(Object.keys(LAUNCHER_UPS).map(k => [k, clamp((r.launcherUps || {})[k] | 0, 0, 3)])), launcherPicks: Math.max(0, r.launcherPicks | 0),
        offers: (r.offers || []).filter(k => typeof k === 'string' && TROOPS[k.replace('up:', '')]), rerolls: Math.max(0, r.rerolls | 0), runStats: Object.assign({ frames: 0, launches: 0, blocks: 0, kills: 0, lost: 0 }, r.runStats) };
    }
  } catch (e) { /* a broken save is ignored */ }
}
function saveRun(phase) {
  savedRun = { level, phase, owned: { ...owned }, upgrades: { ...upgrades }, launcherUps: { ...launcherUps }, launcherPicks, bank, offers: [...offers], rerolls, runStats: { ...runStats } };
  writeSave();
}
function resumeRun() {
  const r = savedRun; if (!r) return startNewRun();
  owned = { ...r.owned }; upgrades = { ...r.upgrades };
  launcherUps = { loader: 0, auto: 0, shield: 0, guns: 0, ...(r.launcherUps || {}) }; launcherPicks = r.launcherPicks || 0; bank = r.bank; offers = [...r.offers]; rerolls = r.rerolls || 0; runStats = { ...r.runStats };
  STARTING_TROOPS.forEach(t => owned[t] = 1);           // runs saved before the Scout was a starting troop
  closeSheet();
  if (r.phase === 'shop' && r.level < LEVELS.length - 1) { level = r.level; setWorld(worldOf(level)); state = 'win'; lastWin = null; syncBar(); openArmory(); }
  else loadLevel(r.level);
}
function startNewRun() {
  runStats = { frames: 0, launches: 0, blocks: 0, kills: 0, lost: 0 };

  closeSheet();

}

// ---------------------------------------------------------------- top strip
const hudCache = {};

  if (clock % 15 === 0) syncInfo();                        // keeps the ability countdown current
  // show on the Advance / Retreat buttons what the squad is doing on its own
  const auto = state === 'play' && !keys.l && !keys.r && soldiers.some(s => s.gnd && !isAir(s) && !hasNoGun(s.t)) ? (enemies.length ? 'l' : 'r') : '';
  if (hudCache.auto !== auto) { hudCache.auto = auto; $('btnRetreat').classList.toggle('auto', auto === 'l'); $('btnAdvance').classList.toggle('auto', auto === 'r'); }
}
function uiBump(id) { const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
let baseHitTimer = 0;

// ---------------------------------------------------------------- troop bar
function toolCost(k) { return STRUCTURES[k] ? STRUCTURES[k].cost : launchCost(k); }
function buildBar() {
  const bar = $('bar'); bar.innerHTML = '';
  [...BAR_ORDER, 'bar', 'pad'].forEach(k => {
    const def = TROOPS[k] || STRUCTURES[k], cost = toolCost(k);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'troop' + (k === 'bar' ? ' sep' : ''); b.dataset.k = k;
    b.setAttribute('aria-label', def.name + (cost ? ', costs ' + cost + ' coins' : ', free'));
    b.title = def.name;
    b.innerHTML = `<canvas data-size="34" aria-hidden="true"></canvas><span class="nm">${def.short}</span><span class="cost${cost ? '' : ' free'}">${cost ? '$' + cost : 'free'}</span><span class="key" aria-hidden="true"></span>`;
    b.addEventListener('click', () => selectTool(k));
    bar.appendChild(b);
  });
  syncBar();
  requestAnimationFrame(() => bar.querySelectorAll('.troop').forEach(b => drawPortrait(b.querySelector('canvas'), b.dataset.k)));
}
function visibleTools() { return [...BAR_ORDER.filter(k => owned[k]), 'bar', 'pad']; }
function syncBar() {
  const vis = visibleTools();
  let shown = 0;
  $('bar').querySelectorAll('.troop').forEach(b => {
    const k = b.dataset.k, show = vis.includes(k);
    if (b.hidden !== !show) { b.hidden = !show; b.style.display = show ? '' : 'none'; if (show) drawPortrait(b.querySelector('canvas'), k); }
    if (!show) return;
    shown++;
    b.classList.toggle('on', k === tool);
    b.classList.toggle('poor', coins < toolCost(k));
    b.classList.toggle('ab', abilityReady(k));
    const cost = toolCost(k), ce = b.querySelector('.cost'), txt = cost ? '$' + cost : 'free';
    if (ce.textContent !== txt) { ce.textContent = txt; ce.classList.toggle('free', !cost); }
    b.setAttribute('aria-pressed', k === tool ? 'true' : 'false');
    b.querySelector('.key').textContent = shown <= 9 ? String(shown) : shown === 10 ? '0' : '';
  });

}
function selectTool(k, quiet) {

  tool = k; aim.active = false;

function syncInfo() {

  const others = app.offsetHeight - field.offsetHeight;      // height of everything except the battlefield
  let w = stage.clientWidth, h = w * H / W;

  // everywhere else it shrinks so the whole game fits on one screen.

  if (h > maxH && !uprightPhone) { h = Math.max(maxH, Math.min(190, h)); w = h * W / H; }

  cv.style.width = inner + 'px'; cv.style.height = innerH + 'px';
  cssScale = inner / W;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);    // sharper than 2x is invisible here and costs phone memory
  const bw = Math.max(300, Math.min(2000, Math.round(inner * dpr)));

  const p = toWorld(e); pointer.x = p.x; pointer.y = p.y; pointer.inside = true;
  if (aim.active && e.pointerId === aim.id) {
    // On a small screen a full pull would be a tiny finger movement, so the pull is scaled
    // to need a comfortable drag (never more than 1.25 world units per screen pixel).
    const k = Math.min(p.scale, 1.25);
    aim.dx = (aim.sx - e.clientX) * k; aim.dy = (aim.sy - e.clientY) * k;
  }
});
cv.addEventListener('pointerleave', () => { pointer.inside = false; });
function endAim(e, fire) {
  if (!aim.active || (e && e.pointerId !== aim.id)) return;
  aim.active = false;
  if (!fire || state !== 'play' || paused) return;
  const v = pullToVelocity(aim.dx, aim.dy);
  if (v.len < 12) return;                                   // too short a pull: cancelled
  if (launchesLeft <= 0) { Sound.play('deny'); showHint('No launches left', 2200, true); return; }
  if (!canLaunch()) { showHint('Wait for your soldier to land', 1400); return; }
  if (coins < launchCost(tool)) { Sound.play('deny'); showHint('Not enough coins for a ' + TROOPS[tool].short, 2200, true); uiBump('tagCoins'); return; }
  launchSoldier(tool, v.vx, v.vy);
}
cv.addEventListener('pointerup', e => endAim(e, true));
cv.addEventListener('pointercancel', e => endAim(e, false));
cv.addEventListener('contextmenu', e => e.preventDefault());

// Advance / Retreat buttons: active while held.
[['btnRetreat', 'l'], ['btnAdvance', 'r']].forEach(([id, k]) => {
  const b = $(id);
  const set = v => e => { e.preventDefault(); Sound.unlock(); keys[k] = v; b.classList.toggle('held', !!v); if (v && tutorial.step < 3 && !$('hint').classList.contains('warn')) hideHint(); };
  b.addEventListener('pointerdown', set(1));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, set(0)));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
function holdKey(k, v) { keys[k] = v; $(k === 'l' ? 'btnRetreat' : 'btnAdvance').classList.toggle('held', !!v); }

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (sheetName) {
    if (k === 'Escape' && (sheetName === 'pause' || sheetName === 'help')) { e.preventDefault(); sheetName === 'help' ? ACTIONS.helpBack() : closeSheet(); }
    else if (k === 'p' && sheetName === 'pause') closeSheet();
    return;
  }
  if (k === 'ArrowLeft' || k === 'a') { holdKey('l', 1); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd') { holdKey('r', 1); e.preventDefault(); }
  else if (e.repeat) return;
  else if (k === 'p' || k === 'Escape') openPause();
  else if (k === 'f') toggleFast();
  else if (k === 'm') toggleSound();
  else if (k === 'n') toggleMusic();
  else if (k === 'q') { if (useAbility(tool)) syncBar(); }
  else if (k === 'h' || k === '?') openHelp();
  else if (k >= '0' && k <= '9') { const vis = visibleTools(), i = k === '0' ? 9 : +k - 1; if (vis[i]) selectTool(vis[i]); }
});
addEventListener('keyup', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'ArrowLeft' || k === 'a') holdKey('l', 0);
  if (k === 'ArrowRight' || k === 'd') holdKey('r', 0);
});
// Let go of everything if the window loses focus, and pause when the tab is hidden.
addEventListener('blur', () => { holdKey('l', 0); holdKey('r', 0); aim.active = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) openPause(); });
document.addEventListener('click', () => Sound.unlock(), true);

// =====================================================================
//  8. MAIN LOOP — the battle always runs at 60 steps per second, whatever
//     the screen's refresh rate is (a 120 Hz or 144 Hz screen used to make
//     the whole game run twice as fast).
// =====================================================================
const STEP = 1000 / 60;
let lastTime = 0, owed = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(now - lastTime, 100);                  // after a long pause, do not try to catch up
  lastTime = now;
  if (Math.abs(dt - STEP) < 2) dt = STEP;                   // steady pacing on ordinary 60 Hz screens
  if (!paused) {
    owed += dt * (fast && state === 'play' ? 2 : 1);
    let steps = 0;
    while (owed >= STEP && steps < 5) { update(); updateFx(); owed -= STEP; steps++; }
    if (steps === 5) owed = 0;
  }
  syncHud();
  draw();
}

let booted = false;
function boot(kept) {
  if (booted) return;                                     // never run two copies of the game in one page
  booted = true;
  readSave();
  if (kept && kept.save) readSave(kept.save);              // carried over when the page updates itself
  syncSoundButton();
  buildBar();
  // Show the first level of the saved run's world behind the title, with the fortress already settled.
  loadLevel(savedRun ? worldOf(savedRun.level) * 30 : 0); state = 'title';
  for (let i = 0; i < 60; i++) stepBlocks();
  booting = false;
  fit();
  openTitle();
  lastTime = performance.now();
  requestAnimationFrame(frame);
}
// Inside Claude, a page can hand its state to the next version of itself.
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ save: { run: savedRun, best, muted: Sound.muted, musicOff: Sound.musicOff, tutorialDone } })); } catch (e) { /* optional */ } }
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
// If the browser throws the canvas away to save memory, paint the background again when it comes back.
cv.addEventListener('contextrestored', () => { paintBackdrop(); });

</script>
</body>
